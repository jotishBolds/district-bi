# ============================================
# District BI - Docker Compose Configuration
# For local development and production deployment
# ============================================

services:
  # ==========================================
  # Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: district-bi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}

      # NextAuth
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # App Settings
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-false}

      # AWS S3
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}

      # Email
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      - EMAIL_SERVER_SECURE=${EMAIL_SERVER_SECURE}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}

      # SMS (ThunderSMS)
      - THUNDERSMS_USERNAME=${THUNDERSMS_USERNAME}
      - THUNDERSMS_API_KEY=${THUNDERSMS_API_KEY}
      - THUNDERSMS_SENDER_ID=${THUNDERSMS_SENDER_ID}
      - THUNDERSMS_BASE_URL=${THUNDERSMS_BASE_URL}
      - THUNDERSMS_ENTITY_ID=${THUNDERSMS_ENTITY_ID}
      - THUNDERSMS_TEMPLATE_ID=${THUNDERSMS_TEMPLATE_ID}

      # Redis (for rate limiting in production)
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - district-bi-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # PostgreSQL Database (for local/self-hosted)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: district-bi-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-district_bi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-district_bi}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - district-bi-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-district_bi} -d ${POSTGRES_DB:-district_bi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Redis (Optional - for rate limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: district-bi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - district-bi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Nginx Reverse Proxy (Optional - for production)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: district-bi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - district-bi-network
    profiles:
      - production

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  district-bi-network:
    driver: bridge
